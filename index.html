<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wallace Shift | Websites, Web Apps &amp; Automation</title>
    <meta
      name="description"
      content="Wallace Shift creates distinctive websites, web apps, and automations that help growing businesses earn trust and move forward."
    />
    <meta name="theme-color" content="#060708" />
    <!-- Canonical, Open Graph, and Twitter tags are emitted per route by
         the prerender step in vite.config.ts, so they are deliberately
         absent here: a copy in this template would be inherited by every
         route and duplicate (or contradict) the correct one. -->

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/favicon-512.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <link rel="preload" as="image" href="/media/wallace-shift-hero-poster.webp" fetchpriority="high" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
