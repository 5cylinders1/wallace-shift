<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>SoLara Salon · Haircolor &amp; Cuts in South Overland Park, KS</title>
    <meta name="description" content="SoLara Salon is Lara Black's haircolor studio inside Aspen Salon &amp; Spa Suites in Overland Park, KS: custom color, highlights, vivid color, color correction, cuts and keratin. Open 7 days." />

         compete with the salon's own listings in search: if it moves to the
         salon's domain, drop this tag and point the canonical and og:url there. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#16120f" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="canonical" href="https://wallaceshift.com/demo/solara" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SoLara Salon" />
    <meta property="og:title" content="SoLara Salon · Haircolor, made for you" />
    <meta property="og:description" content="Custom color, highlights, vivid color and color correction by Lara Black in South Overland Park." />
    <meta property="og:url" content="https://wallaceshift.com/demo/solara" />
    <meta property="og:image" content="https://wallaceshift.com/demos/solara/preview.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A stylist's comb drawn through glossy, freshly colored brown hair" />

    <link rel="icon" type="image/svg+xml" href="/demos/solara/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preload" as="image" type="image/webp" href="/demos/solara/media/hero-poster-720.webp" media="(max-aspect-ratio: 4/5)" fetchpriority="high" />
