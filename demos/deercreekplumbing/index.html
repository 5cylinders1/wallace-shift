    <script>
      (function () {
        try {
          var saved = JSON.parse(localStorage.getItem('dcp-reading') || '{}')
          document.documentElement.toggleAttribute('data-dcp-large', Boolean(saved.large))
          document.documentElement.toggleAttribute('data-dcp-still', Boolean(saved.still))
        } catch (error) { /* Browser preferences work without saved settings. */ }
      })()
    </script>
  </head>
  <body class="dcp-body">
    <div id="root"></div>
